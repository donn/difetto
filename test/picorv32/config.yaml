DESIGN_NAME: picorv32
VERILOG_FILES: dir::picorv32.v
CLOCK_PORT: clk
CLOCK_PERIOD: 24
FP_CORE_UTIL: 40
SYNTH_WRITE_NOATTR: false

DRT_THREADS: 4  # <- ok i just dont want to die of old age
DRT_ANTENNA_REPAIR_ITERS: 0
RUN_ANTENNA_REPAIR: false
ERROR_ON_DISCONNECTED_PINS: false
GRT_ALLOW_CONGESTION: true
RUN_DUMP_CONGESTION_HEATMAP: true

# DFT
DFT_TEST_MODE_WIRE: tm
DFT_TEST_CLOCK_WIRE: clk
DFT_SCAN_IN_PATTERN: sci
DFT_SCAN_OUT_PATTERN: sco
DFT_SCAN_ENABLE_PATTERN: sce
scl::sky130_fd_sc_hd:
  DFT_JSON_MAPPING: dir::../../tech/sky130_fd_sc_hd_mapping.json
scl::gf180mcu_fd_sc_mcu7t5v0:
  DFT_JSON_MAPPING: dir::../../tech/gf180mcu_fd_sc_mcu7t5v0_mapping.json
scl::sg13g2_stdcell:
  DFT_JSON_MAPPING: dir::../../tech/sg13g2_stdcell_mapping.json
DFT_BSCAN_EXCLUDE_IO:
  - clk
  - tm
  - "!resetn"
  - sce
  - sci
  - sco

meta:
  flow: DifettoPNR
