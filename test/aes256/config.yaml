# Basics
DESIGN_NAME: aes_256
VERILOG_FILES:
- dir::round.v
- dir::table.v
- dir::top.v
CLOCK_PERIOD: 5
CLOCK_PORT: clk
FP_CORE_UTIL: 50

# Synthesis
SYNTH_WRITE_NOATTR: false
ERROR_ON_SYNTH_CHECKS: false

# We want the results RAW
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
DRT_THREADS: 16 # <- ok i just dont want to die of old age
DRT_ANTENNA_REPAIR_ITERS: 0
ERROR_ON_DISCONNECTED_PINS: false
GRT_ADJUSTMENT: 0.2

# DFT
DFT_TEST_MODE_WIRE: tm
DFT_TEST_CLOCK_WIRE: clk
DFT_SCAN_IN_PATTERN: sci
DFT_SCAN_OUT_PATTERN: sco
DFT_SCAN_ENABLE_PATTERN: sce
DFT_JSON_MAPPING: dir::../sky130_mapping.json
DFT_BSCAN_EXCLUDE_IO:
  - clk
  - tm
  - "!rst_n"
  - sce
  - sci
  - sco

meta:
  flow: DifettoPNR
